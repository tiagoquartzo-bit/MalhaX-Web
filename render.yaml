services:
  - type: web
    name: malhax-web-test
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && corepack pnpm install --frozen-lockfile && corepack pnpm --filter @activia/web exec next build --webpack
    startCommand: corepack pnpm --filter @activia/web start
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://boefbtfpesqvnyxrihga.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
